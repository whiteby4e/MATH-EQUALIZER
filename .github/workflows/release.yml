name: Build downloadable packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "release-v0.1.0"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows Modern
            os: windows-latest
            python: "3.12"
            requirements: requirements.txt
            package: math-equalizer-windows-modern
            pyinstaller: ">=6,<7"
          - name: Windows Legacy
            os: windows-latest
            python: "3.8"
            requirements: requirements-legacy-windows.txt
            package: math-equalizer-windows-legacy
            pyinstaller: "==5.13.2"
          - name: Linux x64
            os: ubuntu-22.04
            python: "3.12"
            requirements: requirements.txt
            package: math-equalizer-linux-x64
            pyinstaller: ">=6,<7"
          - name: macOS Apple Silicon
            os: macos-14
            python: "3.12"
            requirements: requirements.txt
            package: math-equalizer-macos-arm64
            pyinstaller: ">=6,<7"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade "pip<24.1" || python -m pip install --upgrade pip
          python -m pip install -r "${{ matrix.requirements }}"
          python -m pip install "pyinstaller${{ matrix.pyinstaller }}"
      - name: Build executable
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "Windows Legacy" ]; then
            export MATH_EQUALIZER_LEGACY_WINDOWS=1
            python -m PyInstaller --noconfirm --clean --windowed --exclude-module PySide6 --name MATH-EQUALIZER main.py
          else
            python -m PyInstaller --noconfirm --clean --windowed --name MATH-EQUALIZER main.py
          fi
      - name: Add documentation
        shell: bash
        run: |
          cp README.md dist/MATH-EQUALIZER/README.md
          cp LICENSE dist/MATH-EQUALIZER/LICENSE
          if [ "${{ matrix.name }}" = "Windows Legacy" ]; then cp requirements-legacy-windows.txt dist/MATH-EQUALIZER/requirements-legacy-windows.txt; else cp "${{ matrix.requirements }}" dist/MATH-EQUALIZER/requirements.txt; fi
      - name: Package
        shell: bash
        run: |
          cd dist
          7z a "../${{ matrix.package }}.zip" MATH-EQUALIZER
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: ${{ matrix.package }}.zip

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release-v0.1.0'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "release-v0.1.0" ]; then
            RELEASE_TAG="v0.1.0"
          else
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-assets/*.zip --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${RELEASE_TAG}" release-assets/*.zip --repo "${GITHUB_REPOSITORY}" --generate-notes --title "MATH-EQUALIZER ${RELEASE_TAG}"
          fi
